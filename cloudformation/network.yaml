AWSTemplateFormatVersion: '2010-09-09'

Description: Create VPC for aws-iac-study

Resources:
  MainVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: aws-iac-study-vpc
